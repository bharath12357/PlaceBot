{% extends "base.html" %}
{% block title %}Log in - PlaceBot{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<main class="auth-card">
  <h1 class="logo">PlaceBot</h1>
  <p class="muted">AI placement interview coach</p>
  <h2>Log in</h2>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="btn primary full" type="submit">Log in</button>
  </form>
  <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</main>
{% endblock %}
