{% extends "base.html" %}
{% block title %}Sign up - PlaceBot{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<main class="auth-card">
  <h1 class="logo">PlaceBot</h1>
  <p class="muted">AI placement interview coach</p>
  <h2>Create account</h2>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('register') }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus minlength="3" maxlength="30"
           pattern="[A-Za-z0-9_]+" title="Letters, numbers and underscore only" autocomplete="username">
    <label for="password">Password (min 6 characters)</label>
    <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password">
    <button class="btn primary full" type="submit">Sign up</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</main>
{% endblock %}
