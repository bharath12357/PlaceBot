{% extends "base.html" %}
{% block title %}PlaceBot - Interview Coach{% endblock %}
{% block body_class %}chat-page{% endblock %}
{% block content %}
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <h1 class="logo">PlaceBot</h1>
      <label for="topic-select" class="small-label">Topic for new chats</label>
      <select id="topic-select">
        {% for key, label in topic_labels.items() %}
        <option value="{{ key }}">{{ label }}</option>
        {% endfor %}
      </select>
      <button id="new-chat" class="btn primary full" type="button">+ New chat</button>
    </div>

    <ul id="conversation-list" class="conv-list"></ul>

    <div class="sidebar-bottom">
      <span class="user-name">{{ g.user.username }}</span>
      <form method="post" action="{{ url_for('logout') }}">
        <button class="btn ghost" type="submit">Log out</button>
      </form>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>

  <main class="chat">
    <header class="chat-header">
      <button id="menu-btn" class="icon-btn" type="button" aria-label="Open chat list">&#9776;</button>
      <div>
        <div id="chat-title" class="chat-title">New chat</div>
        <div id="chat-topic" class="muted"></div>
      </div>
    </header>

    <div id="messages" class="messages" aria-live="polite"></div>

    <form id="chat-form" class="composer">
      <textarea id="input" rows="1" maxlength="2000"
                placeholder="Type your message... (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="send-btn" class="btn primary" type="submit">Send</button>
    </form>
  </main>
</div>

<script id="topic-data" type="application/json">{{ topic_labels|tojson }}</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='chat.js') }}"></script>
{% endblock %}
